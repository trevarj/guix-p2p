<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="86400">
<title>guix-p2p dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080908;--fg:#f5d000;--acc:#d4a800;--dim:#5a4a12;
  --bg2:#10110f;--bg3:#191b18;--line:#2f2b14;--err:#d24b4b;--ok:#56c271;--warn:#d8a642;
  --muted:#9c8832;--panel:#0f100e;--panel2:#151711;
  --font:'Cascadia Code','JetBrains Mono','Fira Code','IBM Plex Mono',monospace
}
.theme-green{--fg:#59d35f;--acc:#30a943;--dim:#1c5a28;--ok:#69e079;--muted:#67a86f}
.theme-amber{--fg:#ffb000;--acc:#d68f00;--dim:#69450e;--ok:#ffcf54;--muted:#c08e31}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;
  line-height:1.4;display:flex;flex-direction:column;overflow:hidden;
  position:relative
}
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(rgba(0,0,0,.03) 0px,transparent 2px);
  pointer-events:none;z-index:999
}
*{scrollbar-width:thin;scrollbar-color:var(--dim) var(--bg2)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:var(--bg2);border-left:1px solid var(--line)}
*::-webkit-scrollbar-thumb{background:var(--dim);border:2px solid var(--bg2);border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:var(--acc)}
*::-webkit-scrollbar-corner{background:var(--bg2)}
header{
  background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;gap:16px
}
header strong{font-size:15px;letter-spacing:1px}
header .id{font-size:11px;opacity:.6}
header .stats{display:grid;grid-template-columns:repeat(7,auto);gap:8px;font-size:11px}
header .stats div{border:1px solid var(--line);background:var(--panel);padding:4px 7px;min-width:74px}
header .stats span{display:block;color:var(--acc);font-weight:bold;font-size:14px;line-height:1.1}
header button{
  background:var(--bg3);color:var(--fg);border:1px solid var(--dim);
  padding:5px 10px;font-family:var(--font);font-size:11px;cursor:pointer;border-radius:4px
}
header button:hover{border-color:var(--acc)}
main{
  display:grid;grid-template-columns:1.35fr 1fr 1fr;grid-template-rows:minmax(150px,.58fr) minmax(260px,1.15fr) minmax(210px,.85fr) minmax(150px,.45fr);
  grid-template-areas:
    "transfer transfer transfer"
    "packages packages seeds"
    "peers catalog builds"
    "events events events";
  flex:1;overflow:hidden;gap:8px;padding:8px
}
.panel{
  border:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025)
}
.packages-panel{grid-area:packages}
.seeds-panel{grid-area:seeds}
.transfer-panel{grid-area:transfer}
.peers-panel{grid-area:peers}
.catalog-panel{grid-area:catalog}
.builds-panel{grid-area:builds}
.events{grid-area:events;min-height:160px}
.panel h2{
  font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--acc);margin:-2px 0 8px;position:sticky;top:-10px;
  background:linear-gradient(var(--panel),var(--panel));padding:8px 0 6px;z-index:1;
  display:flex;align-items:center;gap:6px
}
.panel h2::before{content:'';width:6px;height:6px;border:1px solid var(--acc);display:inline-block}
.panel h2 .badge{
  display:inline-block;background:var(--acc);color:var(--bg);
  padding:0 5px;margin-left:6px;font-size:10px;border-radius:2px;vertical-align:middle
}
.events{border-top:1px solid var(--line)}
.event-tools{display:flex;gap:4px;align-items:center;margin:-2px 0 8px;flex-wrap:wrap}
.event-filter{
  background:var(--bg3);border:1px solid var(--line);color:var(--muted);
  font-family:var(--font);font-size:10px;padding:3px 7px;cursor:pointer;border-radius:4px
}
.event-filter.active{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.events .entry{display:grid;grid-template-columns:74px 22px 92px 1fr;gap:6px;align-items:start;font-size:11px;padding:3px 0;border-bottom:1px solid var(--line)}
.events .entry.added{animation:slidein .3s ease}
.events .entry .ts{color:var(--dim);margin-right:8px}
.events .entry .kind{color:var(--muted);text-transform:uppercase;font-size:10px}
.events .entry .msg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.events .entry.peer-conn .sym{color:var(--ok)}
.events .entry.peer-disc .sym{color:var(--dim)}
.events .entry.providers .sym{color:var(--acc)}
.events .entry.dl-start .sym{color:var(--fg)}
.events .entry.dl-ok .sym{color:var(--ok)}
.events .entry.dl-fail .sym{color:var(--err)}
.events .entry.seed-add .sym{color:var(--ok)}
.events .entry.block-served .sym{color:var(--acc)}
.events .entry.catalog .sym{color:var(--muted)}

@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.peer-row,.build-row,.seed-row,.package-row,.catalog-row{
  display:flex;align-items:center;gap:6px;padding:3px 0;
  border-bottom:1px solid var(--line);font-size:12px
}
.peer-row .flag,.build-row .flag,.seed-row .flag,.package-row .source{font-size:14px;min-width:24px}
.peer-row .peer-id{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peer-row .bar,.build-row .bar{flex:1;height:6px;background:var(--bg3)}
.peer-row .bar-inner,.build-row .bar-inner{height:100%;background:var(--acc)}
.peer-row .meta{min-width:90px;text-align:right;font-size:11px;opacity:.8}
.peer-row.offline{opacity:.55}
.catalog-row,.build-row,.seed-row,.package-row{cursor:pointer;border-radius:4px;padding-left:3px;padding-right:3px}
.catalog-row:hover,.build-row:hover,.seed-row:hover,.package-row:hover{background:var(--panel2)}
.catalog-row .path,.build-row .path,.seed-row .path,.package-row .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;opacity:.7}
.catalog-row .size{min-width:70px;text-align:right;font-size:11px;opacity:.6}
.catalog-row .p2p{min-width:40px;text-align:center;font-size:10px}
.catalog-row .p2p.yes{color:var(--ok)}
.catalog-row .p2p.no{color:var(--dim)}
.build-row .path,.seed-row .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;opacity:.7}
.build-row .providers{min-width:60px;text-align:right;color:var(--acc)}
.seed-row .hash{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;opacity:.7;font-family:var(--font)}
.seed-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(96px,auto) auto;align-items:center;column-gap:8px}
.seed-row .seed-name{min-width:0;overflow:hidden}
.seed-row .seed-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seed-row .seed-subtitle{display:block;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seed-row .seed-meta{min-width:96px;text-align:right;font-size:11px;opacity:.8;white-space:nowrap}
.seed-row .seed-meta .sz{color:var(--fg)}
.seed-row .seed-meta .bl{display:block;color:var(--dim);font-size:10px;margin-left:0}
.seed-row .stop-seed{
  background:var(--bg3);color:var(--fg);border:1px solid var(--dim);
  padding:2px 6px;font-family:var(--font);font-size:10px;cursor:pointer;justify-self:end
}
.seed-row .stop-seed:hover{border-color:var(--acc);color:var(--err)}
.package-tools{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.package-search{
  width:100%;background:var(--bg3);color:var(--fg);border:1px solid var(--line);
  padding:7px 8px;font-family:var(--font);font-size:11px;border-radius:4px
}
.package-search:focus{outline:none;border-color:var(--acc)}
.package-hint{min-width:150px;text-align:right;font-size:10px;color:var(--dim)}
.package-row .pkg{flex:1;min-width:0}
.package-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.package-row .source-meta{color:var(--dim);font-size:10px;margin-left:6px}
.package-row .meta{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.package-row .state{min-width:58px;text-align:right;font-size:10px}
.package-row.seeded .state{color:var(--ok)}
.package-row .seed-action{
  background:var(--bg3);color:var(--fg);border:1px solid var(--line);
  padding:3px 7px;font-family:var(--font);font-size:10px;cursor:pointer;border-radius:4px
}
.package-row .seed-action:hover{border-color:var(--acc)}
.package-row.seeded .seed-action{color:var(--dim)}
.transfer-card{
  display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:12px;align-items:center;
  border:1px solid var(--line);background:var(--bg2);padding:8px;border-radius:4px;
  min-height:0;cursor:pointer
}
.transfer-card:hover{border-color:var(--acc);background:var(--panel2)}
.transfer-summary{min-width:0}
.transfer-subject{min-width:0}
.transfer-name{font-size:14px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transfer-hash{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.transfer-meta{display:inline-block;font-size:10px;color:var(--acc);margin:6px 10px 0 0}
.transfer-metrics{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.transfer-metric{border:1px solid var(--line);background:var(--panel);padding:5px 7px;border-radius:4px;min-width:72px;text-align:right}
.transfer-metric .k{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.transfer-metric .v{display:block;font-size:12px;color:var(--fg);margin-top:2px}
.transfer-open{width:100%;font-size:10px;color:var(--dim);text-align:right;margin-top:2px}
.transfer-compact-stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:8px}
.transfer-dot{height:6px;border:1px solid var(--line);background:var(--bg3);border-radius:8px}
.transfer-dot.done{background:var(--ok);border-color:var(--ok)}
.transfer-dot.active{background:var(--acc);border-color:var(--acc)}
.transfer-stages{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:stretch}
.transfer-stage{border:1px solid var(--line);background:var(--bg3);padding:7px;min-width:0;border-radius:4px}
.transfer-stage.done{border-color:var(--ok);box-shadow:inset 0 0 0 1px rgba(51,204,51,.2)}
.transfer-stage.active{border-color:var(--acc)}
.transfer-stage .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.transfer-stage.done .label{color:var(--ok)}
.transfer-stage.active .label{color:var(--acc)}
.transfer-stage .value{font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transfer-detail{display:grid;grid-template-rows:auto auto;gap:8px;min-width:0}
.transfer-peers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.transfer-peer-group{border:1px solid var(--line);background:var(--bg2);padding:7px;min-width:0;border-radius:4px}
.transfer-peer-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin-bottom:4px}
.transfer-peer-row{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:10px;border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.transfer-peer-id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.transfer-peer-count{text-align:right;color:var(--acc)}
.transfer-peer-indices{grid-column:1 / 3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.detail .transfer-stages{grid-template-columns:1fr}
.detail .transfer-stage{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center}
.detail .transfer-stage .value{margin-top:0;white-space:normal;word-break:break-word}
.detail .transfer-peers{grid-template-columns:1fr}

/* transfer flash animation */
.seed-row.flash{animation:flash .6s ease}
@keyframes flash{0%{background:var(--acc);color:var(--bg)}100%{background:transparent;color:var(--fg)}}

/* detail panel overlay */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;justify-content:flex-end
}
.overlay.hidden{display:none}
.detail{
  width:520px;max-width:100%;height:100%;background:var(--bg2);
  border-left:1px solid var(--acc);overflow-y:auto;padding:16px;
  animation:slideleft .25s ease
}
@keyframes slideleft{from{transform:translateX(100%)}to{transform:translateX(0)}}
.detail .close{
  position:absolute;top:8px;right:12px;background:none;color:var(--fg);
  border:none;font-size:18px;cursor:pointer;font-family:var(--font)
}
.detail h2{color:var(--acc);font-size:14px;margin-bottom:12px}
.detail .field{margin-bottom:6px;font-size:12px}
.detail .field label{color:var(--dim);display:inline-block;min-width:100px}
.detail .field .val{color:var(--fg)}
.detail h3{color:var(--acc);font-size:12px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px}
.detail .narinfo-toggle{
  color:var(--acc);cursor:pointer;font-size:12px;margin-top:12px;user-select:none
}
.detail .narinfo-raw{
  display:none;background:var(--bg3);padding:10px;margin-top:8px;
  font-size:11px;white-space:pre-wrap;overflow-x:auto;max-height:300px;overflow-y:auto
}
.detail .narinfo-raw.open{display:block}

.empty{text-align:center;padding:20px;color:var(--dim);font-size:12px;font-style:italic}
.tip{
  position:fixed;z-index:1000;max-width:320px;background:#0b0c0a;color:var(--fg);
  border:1px solid var(--acc);padding:7px 8px;font-size:11px;line-height:1.35;
  box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none;border-radius:4px
}
.tip.hidden{display:none}
[data-tip]{cursor:help}
.help-btn{
  width:16px;height:16px;border:1px solid var(--dim);border-radius:50%;
  background:transparent;color:var(--dim);font-family:var(--font);font-size:10px;
  line-height:14px;text-align:center;padding:0;cursor:pointer;opacity:.55;flex:0 0 auto
}
.help-btn:hover,.help-btn:focus{color:var(--fg);border-color:var(--acc);opacity:1;outline:none}
.help-popover{
  position:fixed;z-index:1001;inset:auto 24px 24px auto;width:420px;max-width:calc(100vw - 32px);
  background:#0b0c0a;border:1px solid var(--acc);box-shadow:0 12px 36px rgba(0,0,0,.55);
  padding:14px;border-radius:6px
}
.help-popover.hidden{display:none}
.help-popover h3{font-size:12px;color:var(--acc);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.help-popover p{font-size:12px;color:var(--fg);line-height:1.5}
.help-popover .close-help{
  position:absolute;top:8px;right:10px;background:transparent;border:0;color:var(--dim);
  font-family:var(--font);font-size:16px;cursor:pointer
}
.help-popover .close-help:hover{color:var(--fg)}

@media (max-width:1100px){
  header{align-items:flex-start;flex-wrap:wrap}
  header .stats{flex-wrap:wrap;gap:10px 16px}
  main{
    grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) auto;
    grid-template-areas:
      "transfer transfer"
      "packages packages"
      "seeds peers"
      "catalog builds"
      "events events"
  }
  .transfer-card{grid-template-columns:1fr}
  .transfer-metrics{justify-content:flex-start}
  .transfer-open{text-align:left}
  .transfer-compact-stages{grid-template-columns:repeat(3,minmax(0,1fr))}
  .transfer-stages{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:720px){
  body{overflow:auto}
  header .stats{width:100%}
  header .stats{grid-template-columns:repeat(2,1fr)}
  main{display:block;overflow:visible}
  .panel{min-height:220px;max-height:360px}
  .events{max-height:260px}
  .package-tools{display:block}
  .package-hint{text-align:left;margin-top:4px}
  .transfer-compact-stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .transfer-stages{grid-template-columns:1fr 1fr}
  .transfer-peers{grid-template-columns:1fr}
  .events .entry{grid-template-columns:62px 18px 1fr}
  .events .entry .kind{display:none}
}
</style>
</head>
<body class="theme-yellow">
<header>
  <div>
    <strong data-tip="Local daemon dashboard for P2P substitute discovery, seeding, and transfer evidence." data-help="dashboard">guix-p2p</strong>
    <br><span class="id" id="peer-id" data-tip="Full libp2p peer id for this node.">--</span>
  </div>
  <div class="stats">
    <div data-tip="Currently connected swarm peers." data-help="connected">CONN <span id="connected">0</span></div>
    <div data-tip="Known peers with reputation records." data-help="known-peers">PEERS <span id="total-peers">0</span></div>
    <div data-tip="Provider records known in the local DHT cache." data-help="dht">DHT <span id="dht-entries">0</span></div>
    <div data-tip="Installed packages discovered from system, kernel, and Guix Home profiles." data-help="package-count">PACKAGES <span id="package-count">0</span></div>
    <div data-tip="Store paths observed through substitute/narinfo lookups." data-help="catalog-count">CATALOG <span id="catalog-count">0</span></div>
    <div data-tip="NARs currently cached locally and available for block serving." data-help="seed-count">SEEDS <span id="seed-count">0</span></div>
    <div data-tip="Daemon dashboard uptime since this process started." data-help="uptime">UPTIME <span id="uptime">00:00:00</span></div>
  </div>
  <div>
    <button onclick="cycleTheme()" data-tip="Cycle dashboard color theme." data-help="theme">theme</button>
  </div>
</header>
<main>
  <div class="panel packages-panel">
    <h2 data-tip="Installed store paths that can be seeded into the local P2P cache." data-help="packages">packages <span class="badge" id="package-badge">0</span></h2>
    <div class="package-tools">
      <input class="package-search" id="package-search" placeholder="search name, version, store path" data-tip="Filter installed packages by name, version, or full /gnu/store path." data-help="package-search">
      <div class="package-hint" data-tip="Profiles scanned: system, kernel, and Guix Home.">installed profiles</div>
    </div>
    <div id="packages-list"><div class="empty">loading packages</div></div>
  </div>
  <div class="panel seeds-panel">
    <h2 data-tip="NARs this node can serve to other peers." data-help="seeds">active seeds <span class="badge" id="seed-badge">0</span></h2>
    <div id="seeds-list"><div class="empty">not seeding</div></div>
  </div>
  <div class="panel transfer-panel">
    <h2 data-tip="Latest P2P proof path: observed package, trusted narinfo, providers, block movement, import, and re-seeding." data-help="transfer">transfer path</h2>
    <div id="transfer-path"><div class="empty">no transfer observed</div></div>
  </div>
  <div class="panel peers-panel">
    <h2 data-tip="Peers known through reputation records and live connection events." data-help="peers">peers</h2>
    <div id="peers-list"><div class="empty">no peers yet</div></div>
  </div>
  <div class="panel catalog-panel">
    <h2 data-tip="Substitute lookups observed by this node, including whether P2P providers were found." data-help="catalog">catalog <span class="badge" id="catalog-badge">0</span></h2>
    <div id="catalog-list"><div class="empty">no packages discovered</div></div>
  </div>
  <div class="panel builds-panel">
    <h2 data-tip="Observed narinfo/build records with provider counts and detail drill-down." data-help="builds">builds</h2>
    <div id="builds-list"><div class="empty">no builds observed</div></div>
  </div>
  <div class="panel events">
    <h2 data-tip="Daemon event history. Reloading the page keeps the latest 500 events from daemon memory." data-help="events">events</h2>
    <div class="event-tools">
      <button class="event-filter active" data-filter="all" onclick="setEventFilter('all')" data-tip="Show every persisted and live dashboard event." data-help="event-filter-all">all</button>
      <button class="event-filter" data-filter="transfer" onclick="setEventFilter('transfer')" data-tip="Downloads, block movement, transfer success, and transfer failures." data-help="event-filter-transfer">transfers</button>
      <button class="event-filter" data-filter="seed" onclick="setEventFilter('seed')" data-tip="Seed creation/removal and local seed actions." data-help="event-filter-seed">seeds</button>
      <button class="event-filter" data-filter="peer" onclick="setEventFilter('peer')" data-tip="Peer connection and disconnection activity." data-help="event-filter-peer">peers</button>
      <button class="event-filter" data-filter="discovery" onclick="setEventFilter('discovery')" data-tip="Narinfo, catalog, and provider discovery events." data-help="event-filter-discovery">discovery</button>
      <button class="event-filter" data-filter="failure" onclick="setEventFilter('failure')" data-tip="Only failed downloads and local dashboard action errors." data-help="event-filter-failure">failures</button>
    </div>
    <div id="events-list"></div>
  </div>
</main>
<div class="overlay hidden" id="overlay">
  <div class="detail">
    <button class="close" onclick="closeDetail()">x</button>
    <div id="detail-content"></div>
  </div>
</div>
<div class="tip hidden" id="tip"></div>
<div class="help-popover hidden" id="help-popover">
  <button class="close-help" onclick="closeHelp()" aria-label="close help">x</button>
  <h3 id="help-title"></h3>
  <p id="help-body"></p>
</div>
<script>
var THEMES=['theme-yellow','theme-green','theme-amber'];
var THEME_IDX=THEMES.indexOf('theme-yellow');
var STARTED=Date.now();

function fmtTime(s){
  var h=Math.floor(s/3600),m=Math.floor(s%3600/60),se=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(se).padStart(2,'0')
}

function fmtSize(b){
  if(b==null)return '?';
  if(b<1024)return b+' B';
  if(b<1048576)return (b/1024).toFixed(1)+' KB';
  if(b<1073741824)return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB'
}

function fmtBytes(b){
  if(b==null||b===0)return '0 B';
  return fmtSize(b)
}

function fmtScore(s){return (s||0).toFixed(2)}

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]
  })
}

function attr(v){return esc(v)}

function jsArg(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

function helpButton(id){
  return '<button class="help-btn" type="button" aria-label="help" data-help-key="'+attr(id)+'" data-tip="Open help for this component" onclick="openHelp(event,\''+jsArg(id)+'\')">?</button>'
}

function decorateHelpButtons(root){
  (root||document).querySelectorAll('[data-help]').forEach(function(el){
    if(el.dataset.helpReady)return;
    el.dataset.helpReady='1';
    if(el.tagName==='INPUT'||el.tagName==='BUTTON'){
      el.insertAdjacentHTML('afterend',helpButton(el.dataset.help))
    }else{
      el.insertAdjacentHTML('beforeend',helpButton(el.dataset.help))
    }
  })
}

function openHelp(ev,id){

function cycleTheme(){
  THEME_IDX=(THEME_IDX+1)%THEMES.length;
  THEMES.forEach(function(t){document.body.classList.remove(t)});
  document.body.classList.add(THEMES[THEME_IDX]);
  localStorage.setItem('guix-p2p-theme',THEMES[THEME_IDX]);
}

function eventCategory(cls){
  if(cls==='peer-conn'||cls==='peer-disc')return'peer';
  if(cls==='seed-add')return'seed';
  if(cls==='providers'||cls==='catalog')return'discovery';
  if(cls==='dl-fail')return'failure';
  if(cls==='dl-start'||cls==='dl-ok'||cls==='block-served')return'transfer';
  return'other'
}

function addEvent(cls,sym,msg,meta){
  meta=meta||{};
  var id=meta.id!=null?meta.id:('local-'+EVENT_IDX++);
  var timestamp=meta.timestamp_ms!=null?meta.timestamp_ms:Date.now();
  var duplicate=EVENTS.some(function(e){return e.id===id});
  if(!duplicate){
    EVENTS.push({
      id:id,
      timestamp_ms:timestamp,
      cls:cls,
      sym:sym,
      msg:msg,
      category:eventCategory(cls),
      added:!meta.persisted
    });
    EVENTS.sort(function(a,b){
      return (a.timestamp_ms||0)-(b.timestamp_ms||0)||String(a.id).localeCompare(String(b.id))
    });
    while(EVENTS.length>500)EVENTS.shift()
  }
  renderEvents()
}

function setEventFilter(filter){
  EVENT_FILTER=filter;
  document.querySelectorAll('.event-filter').forEach(function(btn){
    btn.classList.toggle('active',btn.dataset.filter===filter)
  });
  renderEvents()
}

function renderEvents(){
  var el=document.getElementById('events-list');
  var visible=EVENTS.filter(function(e){
    return EVENT_FILTER==='all'||e.category===EVENT_FILTER
  });
  if(!visible.length){
    el.innerHTML='<div class="empty">no matching events</div>';
    return
  }
  el.innerHTML=visible.slice(-500).map(function(e){
    var d=new Date(e.timestamp_ms||Date.now());
    var ts=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
    return '<div class="entry '+esc(e.cls)+(e.added?' added':'')+'">'
      +'<span class="ts">'+esc(ts)+'</span>'
      +'<span class="sym">'+esc(e.sym)+'</span>'
      +'<span class="kind">'+esc(e.category)+'</span>'
      +'<span class="msg" data-tip="'+attr(e.msg)+'">'+esc(e.msg)+'</span>'
      +'</div>'
  }).join('');
  el.scrollTop=el.scrollHeight;
}

function peerIdShort(pid){return pid.slice(0,12)+'...'}

function flagEmoji(code){
  if(!code||code.length!==2)return'[??] ';
  try{
    var a=code.charCodeAt(0),b=code.charCodeAt(1);
    return String.fromCodePoint(127462+a-65)+String.fromCodePoint(127462+b-65)+' '
  }catch(e){return'[??] '}
}

function packageMatches(pkg,q){
  if(!q)return true;
  q=q.toLowerCase();
  return (pkg.name||'').toLowerCase().indexOf(q)>=0
    ||(pkg.version||'').toLowerCase().indexOf(q)>=0
    ||(pkg.store_path||'').toLowerCase().indexOf(q)>=0
}

function renderPackages(){
  var el=document.getElementById('packages-list');
  var q=(document.getElementById('package-search').value||'').trim();
  var arr=PACKAGES.filter(function(pkg){return packageMatches(pkg,q)});
  document.getElementById('package-count').textContent=PACKAGES.length;
  document.getElementById('package-badge').textContent=arr.length;
  if(!PACKAGES.length){el.innerHTML='<div class="empty">no installed packages found</div>';return}
  if(!arr.length){el.innerHTML='<div class="empty">no packages match</div>';return}
  arr.sort(function(a,b){
    return (a.name||'').localeCompare(b.name||'')
      ||(a.version||'').localeCompare(b.version||'')
      ||(a.source||'').localeCompare(b.source||'')
      ||(a.store_path||'').localeCompare(b.store_path||'')
  });
  var h='';
  arr.slice(0,200).forEach(function(pkg){
    var src=pkg.source==='system'?'sys':(pkg.source==='kernel'?'kern':'home');
    var title=(pkg.name||'?')+' '+(pkg.version||'');
    var state=pkg.seeded?'seeded':'ready';
    var button=pkg.seeded?'seeded':'seed';
    h+='<div class="package-row '+(pkg.seeded?'seeded':'')+'" data-tip="'+attr(pkg.store_path||'')+'">'
      +'<span class="pkg"><span class="name">'+esc(title)+'</span>'
      +'<span class="source-meta">'+esc(src)+'</span>'
      +'<span class="meta">'+esc(pkg.store_path||'')+'</span></span>'
      +'<span class="state">'+esc(state)+'</span>'
      +'<button class="seed-action" data-tip="'+attr(pkg.seeded?'Already seeded locally.':'Seed this installed store path into the local P2P cache.')+'" onclick="seedPackage(event,\''+jsArg(pkg.store_path||'')+'\')">'+esc(button)+'</button>'
      +'</div>';
  });
  if(arr.length>200)h+='<div class="empty">showing 200 of '+arr.length+' matches, refine search</div>';
  el.innerHTML=h;
}

function transferSubjectName(t){
  if(!t)return'no transfer observed';
  if(t.store_path)return storePathName(t.store_path);
  if(t.nar_hash)return t.nar_hash.slice(0,24)+'...';
  return'unknown package'
}

function ensureTransfer(narHash,storePath,narSize){
  if(!TRANSFER||TRANSFER.nar_hash!==narHash){
    TRANSFER={
      nar_hash:narHash||'',
      store_path:storePath||null,
      nar_size:narSize||null,
      stages:{observed:false,trusted:false,providers:false,blocks:false,verified:false,reseeded:false},
      values:{observed:'pending',trusted:'pending',providers:'pending',blocks:'pending',verified:'pending',reseeded:'pending'},
      total_blocks_received:0,
      total_bytes_received:0,
      total_blocks_served:0,
      download_peers:{},
      serving_peers:{}
    }
  }
  if(storePath)TRANSFER.store_path=storePath;
  if(narSize!=null)TRANSFER.nar_size=narSize;
  var aggregate=TRANSFERS[TRANSFER.nar_hash];
  if(aggregate)mergeTransfer(aggregate);
  return TRANSFER
}

function mergeTransfer(t){
  if(!t||!t.nar_hash)return;
  var cur=TRANSFERS[t.nar_hash]||{
    nar_hash:t.nar_hash,
    store_path:null,
    nar_size:null,
    total_blocks_received:0,
    total_bytes_received:0,
    total_blocks_served:0,
    download_peers:{},
    serving_peers:{}
  };
  if(t.store_path)cur.store_path=t.store_path;
  if(t.nar_size!=null)cur.nar_size=t.nar_size;
  if(t.total_blocks_received!=null)cur.total_blocks_received=t.total_blocks_received;
  if(t.total_bytes_received!=null)cur.total_bytes_received=t.total_bytes_received;
  if(t.total_blocks_served!=null)cur.total_blocks_served=t.total_blocks_served;
  cur.download_peers=normalizeTransferPeers(t.download_peers,cur.download_peers);
  cur.serving_peers=normalizeTransferPeers(t.serving_peers,cur.serving_peers);
  TRANSFERS[t.nar_hash]=cur;
  if(TRANSFER&&TRANSFER.nar_hash===t.nar_hash){
    Object.assign(TRANSFER,cur)
  }
}

function normalizeTransferPeers(peers,current){
  var out=current||{};
  if(Array.isArray(peers)){
    out={};
    peers.forEach(function(p){
      if(p&&p.peer_id)out[p.peer_id]={
        blocks:p.blocks||0,
        bytes:p.bytes||0,
        last_indices:p.last_indices||[]
      }
    });
  }else if(peers){
    Object.keys(peers).forEach(function(peerId){
      var p=peers[peerId]||{};
      out[peerId]={blocks:p.blocks||0,bytes:p.bytes||0,last_indices:p.last_indices||[]}
    })
  }
  return out
}

function recordTransferPeer(narHash,kind,peerId,indices,bytes){
  var t=ensureTransfer(narHash,null,null);
  var peers=kind==='download'?t.download_peers:t.serving_peers;
  var p=peers[peerId]||{blocks:0,bytes:0,last_indices:[]};
  indices=indices||[];
  p.blocks+=indices.length;
  p.bytes+=(bytes||0);
  p.last_indices=indices;
  peers[peerId]=p;
  if(kind==='download'){
    t.total_blocks_received+=indices.length;
    t.total_bytes_received+=(bytes||0)
  }else{
    t.total_blocks_served+=indices.length
  }
  TRANSFERS[narHash]=t
}

function markTransfer(narHash,storePath,narSize,stage,value){
  var t=ensureTransfer(narHash,storePath,narSize);
  t.stages[stage]=true;
  t.values[stage]=value||'ok';
  renderTransferPath()
}

function renderTransferPeers(title,peers){
  var ids=Object.keys(peers||{}).sort(function(a,b){
    var pa=peers[a]||{},pb=peers[b]||{};
    return (pb.blocks||0)-(pa.blocks||0)||(pb.bytes||0)-(pa.bytes||0)||a.localeCompare(b)
  });
  var rows=ids.slice(0,4).map(function(id){
    var p=peers[id]||{};
    var indices=(p.last_indices||[]).join(',');
    var bytes=p.bytes?(' / '+fmtBytes(p.bytes)):'';
    return '<div class="transfer-peer-row">'
      +'<div class="transfer-peer-id" data-tip="'+attr(id)+'">'+esc(peerIdShort(id))+'</div>'
      +'<div class="transfer-peer-count">'+esc((p.blocks||0)+' blk'+bytes)+'</div>'
      +'<div class="transfer-peer-indices">'+esc(indices?'last ['+indices+']':'no accepted blocks yet')+'</div>'
      +'</div>'
  }).join('');
  if(ids.length>4)rows+='<div class="transfer-peer-row"><div class="transfer-peer-id">+'+(ids.length-4)+' more</div><div></div></div>';
  var helpKey=title==='downloaded from'?'transfer-downloaded':'transfer-served';
  return '<div class="transfer-peer-group" data-help="'+attr(helpKey)+'">'
    +'<div class="transfer-peer-title">'+esc(title)+'</div>'
    +(rows||'<div class="empty">none observed</div>')
    +'</div>'
}

function transferStageLabels(){
  return [
    ['observed','package observed'],
    ['trusted','narinfo trusted'],
    ['providers','providers found'],
    ['blocks','blocks moved'],
    ['verified','verified/imported'],
    ['reseeded','re-seeded locally']
  ]
}

function transferStageClass(t,key,state){
  var done=t.stages[key];
  var cls=done?'done':(!state.activeSeen?'active':'');
  if(!done)state.activeSeen=true;
  return cls
}

function renderTransferStageDetails(t){
  var state={activeSeen:false};
  return transferStageLabels().map(function(item){
    var key=item[0],label=item[1],cls=transferStageClass(t,key,state);
    return '<div class="transfer-stage '+cls+'" data-help="transfer-stage-'+attr(key)+'">'
      +'<div class="label">'+esc(label)+'</div>'
      +'<div class="value">'+esc(t.values[key]||'pending')+'</div>'
      +'</div>'
  }).join('')
}

function renderTransferStageDots(t){
  var state={activeSeen:false};
  return transferStageLabels().map(function(item){
    var key=item[0],label=item[1],cls=transferStageClass(t,key,state);
    return '<div class="transfer-dot '+cls+'" data-tip="'+attr(label+': '+(t.values[key]||'pending'))+'"></div>'
  }).join('')
}

    +'<div class="field"><label>store</label><span class="val" style="font-size:11px;word-break:break-all">'+esc(TRANSFER.store_path||'?')+'</span></div>'
    +'<div class="field"><label>hash</label><span class="val" style="font-size:11px;word-break:break-all">'+esc(TRANSFER.nar_hash||'?')+'</span></div>'
    +'<div class="field"><label>size</label><span class="val">'+esc(TRANSFER.nar_size!=null?fmtSize(TRANSFER.nar_size):'unknown')+'</span></div>'
    +'<div class="field"><label>downloaded</label><span class="val">'+esc((TRANSFER.total_blocks_received||0)+' blocks, '+fmtBytes(TRANSFER.total_bytes_received||0))+'</span></div>'
    +'<div class="field"><label>served</label><span class="val">'+esc((TRANSFER.total_blocks_served||0)+' blocks')+'</span></div>'
    +'<h3>proof stages</h3>'
    +'<div class="transfer-stages">'+renderTransferStageDetails(TRANSFER)+'</div>'
    +'<h3>peer contributions</h3>'
    +'<div class="transfer-peers">'
    +renderTransferPeers('downloaded from',TRANSFER.download_peers)
    +renderTransferPeers('served to',TRANSFER.serving_peers)
    +'</div>';
  document.getElementById('overlay').classList.remove('hidden');
  decorateHelpButtons(c)
}

function seedPackage(ev,storePath){
  ev.stopPropagation();
  if(!storePath)return;
  var seeded=PACKAGES.some(function(pkg){return pkg.store_path===storePath&&pkg.seeded});
  if(seeded){
    addEvent('seed-add','!','Already seeded; remove it from Active Seeds');
    return;
  }
  fetch('/api/seeds',{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({store_path:storePath})
  }).then(function(r){
    return r.json().then(function(body){
      if(!r.ok)throw body;
      return body
    })
  }).then(function(seed){
    PACKAGES.forEach(function(pkg){
      if(pkg.store_path===storePath)pkg.seeded=true
    });
    renderPackages();
    loadSeeds();
    addEvent('seed-add','*','Seeded '+storePath+' as '+seed.nar_hash.slice(0,16)+'...')
  }).catch(function(err){
    addEvent('dl-fail','x','Seed failed: '+((err&&err.error)||storePath))
  });
}

function stopSeedByHash(seedHash,storePath){
  fetch('/api/seeds/'+encodeURIComponent(seedHash),{method:'DELETE'}).then(function(r){
    if(!r.ok)return r.json().then(function(body){throw body});
    delete SEEDS[seedHash];
    PACKAGES.forEach(function(pkg){
      if(storePath&&pkg.store_path===storePath)pkg.seeded=false
    });
    renderPackages();
    renderSeeds();
    loadSeeds();
    addEvent('seed-add','-','Stopped seeding '+(storePath||seedHash.slice(0,16)+'...'))
  }).catch(function(err){
    addEvent('dl-fail','x','Stop seed failed: '+((err&&err.error)||storePath||seedHash))
  });
}

function flashSeedRow(narHash){
  var rows=document.querySelectorAll('.seed-row');
  rows.forEach(function(r){
    if(r.dataset.hash===narHash){
      r.classList.remove('flash');
      void r.offsetWidth;
      r.classList.add('flash');
    }
  });
}

function renderSeeds(){
  var el=document.getElementById('seeds-list');
  var keys=Object.keys(SEEDS);
  var count=keys.length;
  document.getElementById('seed-count').textContent=count;
  document.getElementById('seed-badge').textContent=count;
  if(!count){el.innerHTML='<div class="empty">not seeding</div>';return}
  var arr=keys.map(function(k){var s=SEEDS[k];s._key=k;return s});
  arr.sort(function(a,b){return(b.nar_size||0)-(a.nar_size||0)});
  var h='';
  arr.forEach(function(s){
    var k=s._key;
    var sz=fmtSize(s.nar_size||0);
    var bl=s.block_count||'?';
    var bs=s.block_size?fmtSize(s.block_size):'256KB';
    var seedTitle=s.store_path?storePathName(s.store_path):k.slice(0,24)+'...';
    var seedSubtitle=s.store_path?s.store_path:k;
    h+='<div class="seed-row" data-hash="'+attr(k)+'" onclick="openSeedDetail(\''+jsArg(k)+'\')">'
      +'<span class="seed-name"><span class="seed-title">'+esc(seedTitle)+'</span>'
      +'<span class="seed-subtitle" data-tip="'+attr(seedSubtitle)+'">'+esc(seedSubtitle)+'</span></span>'
      +'<span class="seed-meta"><span class="sz">'+esc(sz)+'</span><span class="bl">'+esc(bl+' x '+bs)+'</span></span>'
      +'<button class="stop-seed" data-tip="Stop serving this cached NAR and remove its persisted seed path when known." onclick="event.stopPropagation();stopSeedByHash(\''+jsArg(k)+'\',\''+jsArg(s.store_path||'')+'\')">stop</button>'
      +'</div>';
  });
  el.innerHTML=h;
}

function storePathName(storePath){
  if(!storePath)return'?';
  var base=storePath.split('/').pop()||storePath;
  return base.replace(/^[0-9a-df-np-sv-z]{32}-/,'')
}

function openSeedDetail(hash){
  var s=SEEDS[hash];
  if(!s)return;
  var c=document.getElementById('detail-content');
  var sz=fmtSize(s.nar_size||0);
  var bl=s.block_count||'?';
  var bs=s.block_size?fmtSize(s.block_size):'256KB';
  c.innerHTML='<h2>seeded nar</h2>'
    +'<div class="field"><label>package</label><span class="val">'+esc(s.store_path?storePathName(s.store_path):'?')+'</span></div>'
    +'<div class="field"><label>store</label><span class="val" style="font-size:11px;word-break:break-all">'+esc(s.store_path||'?')+'</span></div>'
    +'<div class="field"><label>hash</label><span class="val" style="font-size:11px;word-break:break-all">'+esc(hash)+'</span></div>'
    +'<div class="field"><label>size</label><span class="val">'+esc(sz)+'</span></div>'
    +'<div class="field"><label>blocks</label><span class="val">'+esc(bl+' x '+bs)+'</span></div>'
    +'<div class="field"><label>status</label><span class="val" style="color:var(--ok)">seeding</span></div>';
  var ov=document.getElementById('overlay');
  ov.classList.remove('hidden');
}

function openDetail(hash){
  fetch('/api/build/'+hash).then(function(r){
    if(!r.ok)throw r;
    return r.json()
  }).then(function(b){
    var c=document.getElementById('detail-content');
    var sz=b.nar_size!=null?fmtSize(b.nar_size):'?';
    var dl=b.downloaded_at?'downloaded '+new Date(b.downloaded_at*1000).toISOString().slice(0,16):'not cached';
    var refs=(b.references||[]).map(function(r){return'<div>'+esc(r)+'</div>'}).join('');
    var provs='';
    (b.providers||[]).forEach(function(p){
      provs+='<div class="peer-row"><span style="font-size:11px">'+esc(peerIdShort(p))+'</span></div>';
    });

    var rawNarinfo=b.narinfo_raw||'';
    var rawBlock=rawNarinfo?'<div class="narinfo-toggle" onclick="toggleNarinfo(this)">\u25b6 narinfo (raw signed text)</div>'
      +'<div class="narinfo-raw">'+esc(rawNarinfo)+'</div>':'';

    c.innerHTML='<h2>'+esc(b.nar_hash.slice(0,24)+'...')+'</h2>'
      +'<div class="field"><label>store</label><span class="val">'+esc(b.store_path||'?')+'</span></div>'
      +'<div class="field"><label>size</label><span class="val">'+esc(sz)+'</span></div>'
      +'<div class="field"><label>deriver</label><span class="val">'+esc(b.deriver||'?')+'</span></div>'
      +'<div class="field"><label>status</label><span class="val">'+esc(dl)+'</span></div>'
      +'<h3>references ('+(b.references||[]).length+')</h3>'
      +'<div style="margin-left:8px;font-size:11px">'+(refs||'<span style="color:var(--dim)">none</span>')+'</div>'
      +'<h3>providers ('+(b.providers||[]).length+')</h3>'
      +'<div style="margin-left:8px">'+(provs||'<span style="color:var(--dim)">none known</span>')+'</div>'
      +rawBlock;
    var ov=document.getElementById('overlay');
    ov.classList.remove('hidden');
  }).catch(function(){
    addEvent('dl-fail','x','Failed to load build detail')
  });
}

function closeDetail(){
  document.getElementById('overlay').classList.add('hidden')
}

function toggleNarinfo(el){
  var raw=el.nextElementSibling;
  if(raw.classList.contains('open')){
    raw.classList.remove('open');
    el.textContent='\u25b6 narinfo (raw signed text)'
  }else{
    raw.classList.add('open');
    el.textContent='\u25bc narinfo (raw signed text)'
  }
}

function connectWS(){
  var proto=location.protocol==='https:'?'wss':'ws';
  WS=new WebSocket(proto+'://'+location.host+'/ws');
  WS.onopen=function(){WS_RETRY=1000};
  WS.onmessage=function(msg){
    try{
      var e=JSON.parse(msg.data);
      handleEvent(e)
    }catch(ex){}
  };
  WS.onclose=function(){
    WS=null;
    setTimeout(connectWS,WS_RETRY);
    WS_RETRY=Math.min(WS_RETRY*2,16000)
  };
  WS.onerror=function(){WS&&WS.close()}
}

function handleEvent(e,meta){
  meta=meta||{};
  switch(e.type){
    case 'PeerConnected':
      mergePeer({peer_id:e.peer_id,connected:true,addresses:e.addresses||[]});
      (e.addresses||[]).forEach(function(a){
        var ip=extractIP(a);
        if(ip){PEERS[e.peer_id].ip=ip;PEERS[e.peer_id].country=ipCountry(ip)}
      });
      addEvent('peer-conn','o','Peer '+peerIdShort(e.peer_id)+' connected',meta);
      renderPeers();
      break;

    case 'PeerDisconnected':
      if(PEERS[e.peer_id])PEERS[e.peer_id].connected=false;
      addEvent('peer-disc','-','Peer '+peerIdShort(e.peer_id)+' disconnected',meta);
      renderPeers();
      break;

    case 'ProvidersFound':
      var b=BUILDS[e.nar_hash];
      if(!b){b={nar_hash:e.nar_hash,store_path:null,nar_size:null,providers:0};BUILDS[e.nar_hash]=b}
      b.providers=Math.max(b.providers||0,e.provider_count||0);
      markTransfer(e.nar_hash,b.store_path,b.nar_size,'providers',String(e.provider_count||0)+' peers');
      addEvent('providers','#','Providers found: '+e.nar_hash.slice(0,16)+'... ('+e.provider_count+')',meta);
      renderBuilds();
      break;

    case 'BuildDiscovered':
      mergeBuild({nar_hash:e.nar_hash,store_path:e.store_path,nar_size:e.nar_size,providers:0});
      markTransfer(e.nar_hash,e.store_path,e.nar_size,'observed',e.store_path?storePathName(e.store_path):'observed');
      markTransfer(e.nar_hash,e.store_path,e.nar_size,'trusted','narinfo accepted');
      addEvent('providers','+','Build observed: '+(e.store_path||e.nar_hash.slice(0,16)+'...'),meta);
      renderBuilds();
      break;

    case 'DownloadStarted':
      mergeTransfer({nar_hash:e.nar_hash,store_path:e.store_path,nar_size:e.nar_size});
      markTransfer(e.nar_hash,e.store_path,e.nar_size,'blocks','starting');
      addEvent('dl-start','v','Download started: '+(e.store_path||e.nar_hash)+' ('+fmtSize(e.nar_size)+')',meta);
      break;

    case 'BlockReceived':
      var rxIdxs=e.indices||[];
      recordTransferPeer(e.nar_hash,'download',e.peer_id,rxIdxs,e.bytes||0);
      markTransfer(e.nar_hash,null,null,'blocks',String(rxIdxs.length||1)+' blocks');
      addEvent('dl-start','=','Received '+(rxIdxs.length||1)+' block'+(rxIdxs.length===1?'':'s')+' from '+peerIdShort(e.peer_id),meta);
      break;

    case 'DownloadSucceeded':
      mergeTransfer({nar_hash:e.nar_hash,store_path:e.store_path,nar_size:e.size});
      markTransfer(e.nar_hash,e.store_path,e.size,'verified','imported in '+(e.elapsed_ms/1000).toFixed(1)+'s');
      addEvent('dl-ok','^','Download succeeded: '+(e.store_path||e.nar_hash)+' ('+fmtSize(e.size)+', '+(e.elapsed_ms/1000).toFixed(1)+'s)',meta);
      break;

    case 'DownloadFailed':
      addEvent('dl-fail','x','Download failed: '+(e.store_path||e.nar_hash)+' ('+e.reason+')',meta);
      break;

    case 'CatalogEntry':
      mergeCatalogEntry(e);
      addEvent('catalog','c','Catalog observed: '+(e.store_path||e.hash_part)+(e.p2p_available?' (P2P providers)':' (HTTP fallback)'),meta);
      renderCatalog();
      break;

    case 'SeedAdded':
      SEEDS[e.nar_hash]={nar_size:e.nar_size,block_count:null,block_size:null,store_path:e.store_path};
      PACKAGES.forEach(function(pkg){
        if(pkg.store_path===e.store_path)pkg.seeded=true
      });
      markTransfer(e.nar_hash,e.store_path,e.nar_size,'reseeded','serving locally');
      addEvent('seed-add','*','Seed added: '+e.nar_hash.slice(0,16)+'... ('+fmtSize(e.nar_size)+')',meta);
      renderPackages();
      renderSeeds();
      if(!meta.persisted)loadSeeds();
      break;

    case 'SeedRemoved':
      delete SEEDS[e.nar_hash];
      PACKAGES.forEach(function(pkg){
        if(pkg.store_path===e.store_path)pkg.seeded=false
      });
      addEvent('seed-add','-','Seed removed: '+e.nar_hash.slice(0,16)+'...',meta);
      if(TRANSFER&&TRANSFER.nar_hash===e.nar_hash)renderTransferPath();
      renderPackages();
      renderSeeds();
      break;

    case 'BlockServed':
      var blockIdxs=e.indices||[];
      var blkMsg=blockIdxs.length?blockIdxs.length+' block'+(blockIdxs.length>1?'s':''):'handshake';
      if(blockIdxs.length)recordTransferPeer(e.nar_hash,'serving',e.peer_id,blockIdxs,0);
      markTransfer(e.nar_hash,null,null,'blocks','served '+blkMsg);
      addEvent('block-served','\u2191','Served '+blkMsg+' to '+peerIdShort(e.peer_id)+(e.nar_hash?' for '+e.nar_hash.slice(0,16)+'...':''),meta);
      if(e.nar_hash)flashSeedRow(e.nar_hash);
      break;
  }
}

function extractIP(addr){
  var m=addr.match(/\/ip4\/([^/]+)/);
  if(m)return m[1];
  m=addr.match(/\/ip6\/([^/]+)/);
  return m?m[1]:null
}

function ipCountry(ip){
  var o=parseInt(ip.split('.')[0]);
  if(!o)return null;
  if(o>=1&&o<=4||o===8||o>=13&&o<=14||o>=20&&o<=24||o===27||o>=40&&o<=41||o===44||o===45||o===46||o===47||o>=49&&o<=52||o===54||o===58||o>=60&&o<=69||o===71||o===72||o===73||o===74||o===75||o===76||o>=96&&o<=109||o>=128&&o<=186||o>=192&&o<=199||o===204||o===205||o===206||o===207||o===208||o===209||o===214||o===215||o===216)return'US';
  if(o==5||o===46||o===62||o===77||o===78||o===79||o===80||o===81||o===82||o===83||o===84||o===85||o===86||o===87||o===88||o===89||o===90||o===91||o===92||o===93||o===94||o===95||o===176||o===178||o===212||o===213||o===217)return'EU';
  if(o>=151&&o<=152||o===177||o===179||o===181||o===184||o===187||o===188||o===189||o===190||o===191||o===200||o===201)return'SA';
  if(o>=102&&o<=103||o===105||o===154||o===196||o===197)return'AF';
  if(o>=110&&o<=126||o===150||o===153||o===163||o===175||o===180||o===182||o===183||o===202||o===203||o===210||o===211||o===218||o===219||o===220||o===221||o===222||o===223)return'AS';
  return null
}

function mergePeer(p){
  if(!p||!p.peer_id)return;
  var cur=PEERS[p.peer_id]||{peer_id:p.peer_id,score:0.5,completed:0,failed:0,bytes_served:0,connected:false,addresses:[],country:null,ip:null};
  if(p.score!=null)cur.score=p.score;
  if(p.completed!=null)cur.completed=p.completed;
  if(p.failed!=null)cur.failed=p.failed;
  if(p.bytes_served!=null)cur.bytes_served=p.bytes_served;
  if(p.connected!=null)cur.connected=p.connected;
  if(p.addresses)cur.addresses=p.addresses;
  if(p.country)cur.country=p.country;
  if(p.ip)cur.ip=p.ip;
  PEERS[p.peer_id]=cur
}

function mergeBuild(b){
  if(!b||!b.nar_hash)return;
  var cur=BUILDS[b.nar_hash]||{nar_hash:b.nar_hash,store_path:null,nar_size:null,providers:0,lookup_key:null};
  if(b.lookup_key)cur.lookup_key=b.lookup_key;
  if(b.store_path)cur.store_path=b.store_path;
  if(b.nar_size!=null)cur.nar_size=b.nar_size;
  if(b.provider_count!=null)cur.providers=b.provider_count;
  if(b.providers!=null)cur.providers=b.providers;
  BUILDS[b.nar_hash]=cur
}

function mergeCatalogEntry(c){
  if(!c||!c.hash_part)return;
  var cur=CATALOG[c.hash_part]||{hash_part:c.hash_part,store_path:null,nar_size:null,nar_hash:null,p2p_available:false};
  if(c.store_path)cur.store_path=c.store_path;
  if(c.nar_size!=null)cur.nar_size=c.nar_size;
  if(c.nar_hash)cur.nar_hash=c.nar_hash;
  cur.p2p_available=Boolean(cur.p2p_available||c.p2p_available);
  CATALOG[c.hash_part]=cur
}

function ingestEventEnvelope(entry){
  if(!entry||!entry.event)return;
  handleEvent(entry.event,{
    id:entry.id,
    timestamp_ms:entry.timestamp_ms,
    persisted:true
  })
}

function initTooltips(){
  var tip=document.getElementById('tip');
  function show(el){
    var text=el&&el.dataset?el.dataset.tip:null;
    if(!text)return;
    tip.textContent=text;
    tip.classList.remove('hidden');
    move(lastMouseEvent||{clientX:window.innerWidth/2,clientY:20})
  }
  function hide(){tip.classList.add('hidden')}
  function move(ev){
    if(tip.classList.contains('hidden'))return;
    var pad=12;
    var x=Math.min(ev.clientX+pad,window.innerWidth-tip.offsetWidth-pad);
    var y=Math.min(ev.clientY+pad,window.innerHeight-tip.offsetHeight-pad);
    tip.style.left=Math.max(pad,x)+'px';
    tip.style.top=Math.max(pad,y)+'px'
  }
  var lastMouseEvent=null;
  document.addEventListener('mousemove',function(ev){
    lastMouseEvent=ev;
    move(ev)
  });
  document.addEventListener('mouseover',function(ev){
    var el=ev.target.closest('[data-tip]');
    if(el)show(el)
  });
  document.addEventListener('mouseout',function(ev){
    if(ev.target.closest('[data-tip]'))hide()
  });
  document.addEventListener('focusin',function(ev){
    var el=ev.target.closest('[data-tip]');
    if(el)show(el)
  });
  document.addEventListener('focusout',hide)
}

document.addEventListener('click',function(ev){
  var pop=document.getElementById('help-popover');
  if(pop&&!pop.classList.contains('hidden')&&!pop.contains(ev.target)&&!ev.target.closest('.help-btn')){
    closeHelp()
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape')closeHelp()
});

(function(){
  var saved=localStorage.getItem('guix-p2p-theme');
  if(saved&&THEMES.indexOf(saved)>=0){THEME_IDX=THEMES.indexOf(saved)}
  THEMES.forEach(function(t){document.body.classList.remove(t)});
  document.body.classList.add(THEMES[THEME_IDX]);

  function tickUptime(){
    if(!SERVER_STARTED)return;
    var s=Math.floor((Date.now()-SERVER_STARTED)/1000);
    document.getElementById('uptime').textContent=fmtTime(s)
  }
  setInterval(tickUptime,1000);
  tickUptime();

  function refreshStatus(){
    fetch('/api/status').then(function(r){return r.json()}).then(function(s){
      var peerEl=document.getElementById('peer-id');
      peerEl.textContent=s.peer_id;
      peerEl.dataset.tip=s.peer_id;
      document.getElementById('connected').textContent=s.connected_peers;
      document.getElementById('dht-entries').textContent=s.dht_entries;
      if(s.uptime_secs!=null){
        SERVER_STARTED=Date.now()-s.uptime_secs*1000;
        tickUptime()
      }
    }).catch(function(){})
  }
  setInterval(refreshStatus,5000);
  refreshStatus();

  function loadPeers(){
    fetch('/api/peers').then(function(r){return r.json()}).then(function(ps){
      ps.forEach(function(p){
        mergePeer(p)
      });
      renderPeers()
    }).catch(function(){})
  }

  function loadBuilds(){
    fetch('/api/builds').then(function(r){return r.json()}).then(function(bs){
      bs.forEach(function(b){
        mergeBuild(b)
      });
      renderBuilds()
    }).catch(function(){})
  }

  window.loadSeeds=function(){
    fetch('/api/seeds').then(function(r){return r.json()}).then(function(ss){
      SEEDS={};
      ss.forEach(function(s){
        SEEDS[s.nar_hash]={nar_size:s.nar_size,block_count:s.block_count,block_size:s.block_size,store_path:s.store_path}
      });
      renderSeeds()
    }).catch(function(){})
  };

  function loadPackages(){
    fetch('/api/packages').then(function(r){return r.json()}).then(function(ps){
      PACKAGES=ps||[];
      renderPackages()
    }).catch(function(){
      document.getElementById('packages-list').innerHTML='<div class="empty">failed to load packages</div>'
    })
  }

  function loadCatalog(){
    fetch('/api/catalog').then(function(r){return r.json()}).then(function(cs){
      cs.forEach(function(c){
        mergeCatalogEntry(c)
      });
      renderCatalog()
    }).catch(function(){})
  }

  function loadTransfers(){
    fetch('/api/transfers').then(function(r){return r.json()}).then(function(ts){
      ts.forEach(function(t){mergeTransfer(t)});
      if(!TRANSFER&&ts.length){
        ensureTransfer(ts[0].nar_hash,ts[0].store_path,ts[0].nar_size)
      }
      renderTransferPath()
    }).catch(function(){})
  }

  function loadEvents(){
    return fetch('/api/events').then(function(r){return r.json()}).then(function(es){
      EVENTS=[];
      (es||[]).forEach(function(entry){ingestEventEnvelope(entry)});
      renderEvents()
    }).catch(function(){renderEvents()})
  }

  setInterval(loadPeers,10000);
  setInterval(loadBuilds,10000);
  setInterval(loadSeeds,15000);
  setInterval(loadPackages,30000);
  setInterval(loadCatalog,10000);
  setInterval(loadTransfers,10000);

  loadPeers();
  loadBuilds();
  loadSeeds();
  loadPackages();
  loadCatalog();
  loadTransfers();
  loadEvents().then(connectWS);
  initTooltips();
  decorateHelpButtons(document);
  document.getElementById('package-search').addEventListener('input',renderPackages);
})();
</script>
