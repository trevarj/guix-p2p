[package]
name = "guix-p2p-e2e"
version = "0.1.0"
edition = "2024"
description = "End-to-end multi-node integration tests for guix-p2p-substitute"

[dependencies]
guix-p2p-substitute = { path = ".." }
libp2p = { version = "0.56", features = ["full", "kad", "quic", "tcp", "dns", "request-response", "mdns", "identify", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
