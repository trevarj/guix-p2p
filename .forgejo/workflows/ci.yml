name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks
    runs-on: codeberg-small

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check Guix
        run: |
          guix --version
          guix describe

      - name: Install Guix channels
        run: |
          mkdir -p "$HOME/.config/guix"
          cp .guix/channels.scm "$HOME/.config/guix/channels.scm"
          guix pull --channels="$HOME/.config/guix/channels.scm"
          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$HOME/.config/guix/current/bin" >> "$GITHUB_PATH"
          fi

      - name: Check formatting
        run: |
          guix shell -m manifest.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            exec cargo fmt --all -- --check
          '

      - name: Run clippy
        run: |
          guix shell -m manifest.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            exec cargo clippy --workspace --all-targets --all-features -- -D warnings
          '

      - name: Run tests
        run: |
          guix shell -m manifest.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            exec cargo test --workspace
          '
