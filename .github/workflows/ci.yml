name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Guix
        if: ${{ github.server_url == 'https://github.com' }}
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Install Guix fallback
        run: |
          for profile in \
            /run/current-system/profile \
            /var/guix/profiles/per-user/root/current-guix \
            /root/.config/guix/current \
            "$HOME/.config/guix/current"
          do
            if [ -x "$profile/bin/guix" ]; then
              export PATH="$profile/bin:$PATH"
              if [ -n "${GITHUB_PATH:-}" ]; then
                printf '%s\n' "$profile/bin" >> "$GITHUB_PATH"
              fi
            fi
          done

          if command -v guix >/dev/null 2>&1; then
            guix --version
            exit 0
          fi

          if ! command -v curl >/dev/null 2>&1; then
            echo "curl is required to download the Guix installer" >&2
            exit 1
          fi
          if ! command -v wget >/dev/null 2>&1; then
            mkdir -p /tmp/guix-p2p-ci-bin
            cat > /tmp/guix-p2p-ci-bin/wget <<'SH'
          #!/bin/sh
          output=
          url=
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -O|--output-document)
                output="$2"
                shift 2
                ;;
              --output-document=*)
                output="${1#--output-document=}"
                shift
                ;;
              -q|--quiet|--continue|--show-progress|--progress=*)
                shift
                ;;
              -*)
                shift
                ;;
              *)
                url="$1"
                shift
                ;;
            esac
          done
          if [ -z "$url" ]; then
            exit 1
          fi
          if [ -n "$output" ]; then
            exec curl -fL "$url" -o "$output"
          fi
          exec curl -fL "$url"
          SH
            chmod +x /tmp/guix-p2p-ci-bin/wget
            export PATH="/tmp/guix-p2p-ci-bin:$PATH"
          fi
          if [ "$(id -u)" -ne 0 ] && ! command -v sudo >/dev/null 2>&1; then
            echo "sudo is required to install Guix on a non-root runner" >&2
            exit 1
          fi

          curl -fsSL https://git.savannah.gnu.org/cgit/guix.git/plain/etc/guix-install.sh \
            -o /tmp/guix-install.sh
          chmod +x /tmp/guix-install.sh
          set +e
          if [ "$(id -u)" -eq 0 ]; then
            yes | /tmp/guix-install.sh
          else
            yes | sudo /tmp/guix-install.sh
          fi
          install_status="$?"
          set -e

          for profile in \
            /run/current-system/profile \
            /var/guix/profiles/per-user/root/current-guix \
            /root/.config/guix/current \
            "$HOME/.config/guix/current"
          do
            if [ -x "$profile/bin/guix" ]; then
              export PATH="$profile/bin:$PATH"
              if [ -n "${GITHUB_PATH:-}" ]; then
                printf '%s\n' "$profile/bin" >> "$GITHUB_PATH"
              fi
            fi
          done

          command -v guix
          guix --version
          if command -v guix-daemon >/dev/null 2>&1 && ! pgrep -x guix-daemon >/dev/null 2>&1; then
            guix-daemon --build-users-group=guixbuild --disable-chroot \
              >/tmp/guix-daemon.log 2>&1 &
          fi
          if [ "$install_status" -ne 0 ]; then
            echo "Guix installer exited with status $install_status after installing guix; continuing with manual daemon startup"
          fi

      - name: Check Guix
        run: |
          command -v guix
          guix --version
          guix describe

      - name: Check formatting
        run: |
          guix shell -m manifest-ci.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            exec cargo fmt --all -- --check
          '

      - name: Run clippy
        run: |
          guix shell -m manifest-ci.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            exec cargo clippy --workspace --all-targets --all-features -- -D warnings
          '

      - name: Run tests
        run: |
          guix shell -m manifest-ci.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            exec cargo test --workspace
          '

      - name: Run container smoke e2e
        run: |
          guix shell -m manifest-ci.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export GUIX_P2P_E2E_DASHBOARD_TIMEOUT_SECS=600
            export GUIX_P2P_E2E_NO_GUIX_SHELL=1
            cargo build --bin guix-p2p
            exec cargo run -p guix-p2p-e2e -- container-smoke \
              --package sl \
              --transport tcp \
              --base "${RUNNER_TEMP:-/tmp}/guix-p2p-ci-smoke" \
              --node-a-port 46081 \
              --node-b-port 46082 \
              --node-a-dashboard-port 4071 \
              --node-b-dashboard-port 4072 \
              --guix-p2p-bin target/debug/guix-p2p
          '
