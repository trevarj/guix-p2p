name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "scripts/build-pages-site.sh"
  workflow_run:
    workflows:
      - Benchmarks
    types:
      - completed

permissions:
  actions: read
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve benchmark artifact run
        id: benchmark-run
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "workflow_run") {
              core.setOutput("found", "true");
              core.setOutput("run-id", String(context.payload.workflow_run.id));
              return;
            }

            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "benchmarks.yml",
              branch: "master",
              status: "completed",
              per_page: 20,
            });
            const run = response.data.workflow_runs.find((run) => run.conclusion === "success");
            if (!run) {
              core.warning("No successful benchmark workflow run found; deploying docs without benchmark artifact.");
              core.setOutput("found", "false");
              return;
            }
            core.setOutput("found", "true");
            core.setOutput("run-id", String(run.id));
            core.info(`Using benchmark artifact from run ${run.id}.`);

      - name: Download benchmark artifact
        if: steps.benchmark-run.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.benchmark-run.outputs.run-id }}
          pattern: guix-p2p-benchmark-*
          path: latest-benchmark
          merge-multiple: true

      - name: Select benchmark artifact files
        id: benchmark-artifact
        if: steps.benchmark-run.outputs.found == 'true'
        run: |
          mkdir -p latest-benchmark-selected
          found=false
          if [ -r latest-benchmark/target/guix-p2p-bench/benchmark-results.md ]; then
            cp latest-benchmark/target/guix-p2p-bench/benchmark-results.md latest-benchmark-selected/benchmark-results.md
          elif [ -r latest-benchmark/docs/benchmark-results.md ]; then
            cp latest-benchmark/docs/benchmark-results.md latest-benchmark-selected/benchmark-results.md
          elif [ -r latest-benchmark/benchmark-results.md ]; then
            cp latest-benchmark/benchmark-results.md latest-benchmark-selected/benchmark-results.md
          fi
          if [ -r latest-benchmark-selected/benchmark-results.md ]; then
            found=true
          fi
          if [ -r latest-benchmark/target/guix-p2p-bench/results.csv ]; then
            cp latest-benchmark/target/guix-p2p-bench/results.csv latest-benchmark-selected/results.csv
          elif [ -r latest-benchmark/results.csv ]; then
            cp latest-benchmark/results.csv latest-benchmark-selected/results.csv
          fi
          if [ -r latest-benchmark-selected/results.csv ]; then
            found=true
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Build Pages site from benchmark artifact
        if: steps.benchmark-artifact.outputs.found == 'true'
        env:
          BENCHMARK_RESULTS_MD: latest-benchmark-selected/benchmark-results.md
          BENCHMARK_RESULTS_CSV: latest-benchmark-selected/results.csv
        run: scripts/build-pages-site.sh

      - name: Build Pages site from repository docs
        if: steps.benchmark-artifact.outputs.found != 'true'
        run: scripts/build-pages-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
