name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - standard
      iterations:
        description: Iterations per benchmark case
        required: true
        default: "1"
        type: string
permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: benchmarks-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  vm-benchmark:
    name: VM benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    env:
      BENCHMARK_GUIX_SUBSTITUTE_URLS: >-
        https://ci.guix.trop.in
        https://cache-cdn.guix.moe
        https://cache-fi.guix.moe
        https://guix.bordeaux.inria.fr
        https://nonguix-proxy.ditigal.xyz
        https://ci.guix.gnu.org
        https://bordeaux.guix.gnu.org
        https://cache-sg.guix.moe
        https://mirror.yandex.ru/mirrors/guix
        https://substitutes.nonguix.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Configure Guix daemon substitutes
        run: |
          guix_daemon="$(command -v guix-daemon)"
          test -x "$guix_daemon"
          sudo mkdir -p /etc/systemd/system/guix-daemon.service.d
          {
            echo "[Service]"
            echo "ExecStart="
            printf 'ExecStart=%s --build-users-group=guixbuild "--substitute-urls=%s"\n' "$guix_daemon" "$BENCHMARK_GUIX_SUBSTITUTE_URLS"
          } | sudo tee /etc/systemd/system/guix-daemon.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl restart guix-daemon.service
          systemctl --no-pager --full status guix-daemon.service
      - name: Check benchmark environment
        run: |
          guix_cmd="$(command -v guix)"
          sudo "$guix_cmd" shell -m manifest-ci.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            test -r "$libgcc_dir/libgcc_s.so.1"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            cargo --version
            rustc --version
            test -r "$SSL_CERT_FILE"
            printf "SSL_CERT_FILE=%s\n" "$SSL_CERT_FILE"
            printf "LD_LIBRARY_PATH=%s\n" "$LD_LIBRARY_PATH"
            qemu-system-x86_64 --version
            ssh -V
            cargo fetch --locked
          '

      - name: Run VM benchmark
        run: |
          cleanup() {
            guix_cmd="$(command -v guix)"
            sudo "$guix_cmd" shell -m manifest-ci.scm -- \
              cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e stop --all \
              2>/dev/null || true
            sudo chown -R "$USER:$USER" target docs/benchmark-results.md 2>/dev/null || true
          }
          trap cleanup EXIT
          guix_cmd="$(command -v guix)"
          sudo "$guix_cmd" shell -m manifest-ci.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export GUIX_P2P_E2E_SUBSTITUTE_URLS="$3"
            export GUIX_P2P_E2E_ENABLE_KVM=auto
            export GUIX_P2P_E2E_VM_MEMORY=1536
            export GUIX_P2P_E2E_VM_CPUS=2

            cargo build --locked --release
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e image
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e run Bootstrap
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e run Alice
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e run Bob
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e wait-ssh Bootstrap Alice Bob
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e bootstrap Bootstrap
            exec cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e benchmark \
              --suite "$1" \
              --modes http,p2p-only,p2p-first \
              --http-conditions normal \
              --seed-nodes Alice \
              --fetch-node Bob \
              --http-node Bob \
              --iterations "$2" \
              --output target/guix-p2p-bench
          ' sh "${{ inputs.suite }}" "${{ inputs.iterations }}" "$BENCHMARK_GUIX_SUBSTITUTE_URLS"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guix-p2p-benchmark-${{ inputs.suite }}-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            target/guix-p2p-bench/results.csv
            docs/benchmark-results.md

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp target/guix-p2p-bench/results.csv site/results.csv
          cp docs/benchmark-results.md site/benchmark-results.md
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>guix-p2p benchmarks</title>
            <style>
              :root {
                color-scheme: light dark;
                font-family: system-ui, sans-serif;
                line-height: 1.5;
              }
              body {
                margin: 0 auto;
                max-width: 980px;
                padding: 32px 20px;
              }
              header, section {
                border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent);
                padding-bottom: 24px;
                margin-bottom: 24px;
              }
              h1, h2 {
                line-height: 1.2;
              }
              a {
                color: #0969da;
              }
              pre {
                overflow: auto;
                padding: 16px;
                background: color-mix(in srgb, currentColor 8%, transparent);
              }
              table {
                border-collapse: collapse;
                width: 100%;
              }
              th, td {
                border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent);
                padding: 8px;
                text-align: left;
              }
              .muted {
                opacity: 0.72;
              }
            </style>
          </head>
          <body>
            <header>
              <h1>guix-p2p benchmarks</h1>
              <p class="muted">Latest generated report from the GitHub mirror benchmark workflow.</p>
              <p>
                <a href="benchmark-results.md">Latest markdown report</a>
                · <a href="results.csv">Latest CSV</a>
                · <a href="https://github.com/trevarj/guix-p2p/actions/workflows/benchmarks.yml">Benchmark runs</a>
              </p>
            </header>

            <section>
              <h2>Latest Report</h2>
              <pre id="report">Loading benchmark-results.md...</pre>
            </section>

            <section>
              <h2>Recent Runs</h2>
              <p class="muted">Each run keeps its full CSV and markdown output as a GitHub Actions artifact.</p>
              <table>
                <thead>
                  <tr>
                    <th>Run</th>
                    <th>Status</th>
                    <th>Started</th>
                    <th>Commit</th>
                  </tr>
                </thead>
                <tbody id="runs">
                  <tr><td colspan="4">Loading workflow runs...</td></tr>
                </tbody>
              </table>
            </section>

            <script>
              async function loadReport() {
                const response = await fetch("benchmark-results.md", { cache: "no-store" });
                document.getElementById("report").textContent = response.ok
                  ? await response.text()
                  : "No benchmark report was published yet.";
              }

              async function loadRuns() {
                const runsBody = document.getElementById("runs");
                const response = await fetch(
                  "https://api.github.com/repos/trevarj/guix-p2p/actions/workflows/benchmarks.yml/runs?per_page=20",
                  { cache: "no-store" }
                );
                if (!response.ok) {
                  runsBody.innerHTML = "<tr><td colspan=\"4\">Could not load workflow runs.</td></tr>";
                  return;
                }
                const payload = await response.json();
                runsBody.innerHTML = payload.workflow_runs.map((run) => {
                  const started = new Date(run.created_at).toLocaleString();
                  const sha = run.head_sha.slice(0, 7);
                  return `<tr>
                    <td><a href="${run.html_url}">#${run.run_number}</a></td>
                    <td>${run.conclusion || run.status}</td>
                    <td>${started}</td>
                    <td><a href="${run.head_repository.html_url}/commit/${run.head_sha}">${sha}</a></td>
                  </tr>`;
                }).join("");
              }

              loadReport();
              loadRuns();
            </script>
          </body>
          </html>
          HTML

      - name: Configure Pages
        id: configure-pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        if: steps.configure-pages.outcome == 'success'
        with:
          path: site

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
        if: steps.configure-pages.outcome == 'success'
