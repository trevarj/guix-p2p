name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - standard
      iterations:
        description: Iterations per benchmark case
        required: true
        default: "1"
        type: string
permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: benchmarks-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  vm-benchmark:
    name: VM benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    env:
      BENCHMARK_GUIX_SUBSTITUTE_URLS: >-
        https://ci.guix.trop.in
        https://cache-cdn.guix.moe
        https://cache-fi.guix.moe
        https://guix.bordeaux.inria.fr
        https://nonguix-proxy.ditigal.xyz
        https://ci.guix.gnu.org
        https://bordeaux.guix.gnu.org
        https://cache-sg.guix.moe
        https://mirror.yandex.ru/mirrors/guix
        https://substitutes.nonguix.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Configure Guix daemon substitutes
        run: |
          guix_daemon="$(command -v guix-daemon)"
          test -x "$guix_daemon"
          sudo mkdir -p /etc/systemd/system/guix-daemon.service.d
          {
            echo "[Service]"
            echo "ExecStart="
            printf 'ExecStart=%s --build-users-group=guixbuild "--substitute-urls=%s"\n' "$guix_daemon" "$BENCHMARK_GUIX_SUBSTITUTE_URLS"
          } | sudo tee /etc/systemd/system/guix-daemon.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl restart guix-daemon.service
          systemctl --no-pager --full status guix-daemon.service
      - name: Check benchmark environment
        run: |
          guix_cmd="$(command -v guix)"
          sudo "$guix_cmd" shell -m manifest-ci.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            test -r "$libgcc_dir/libgcc_s.so.1"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            cargo --version
            rustc --version
            test -r "$SSL_CERT_FILE"
            printf "SSL_CERT_FILE=%s\n" "$SSL_CERT_FILE"
            printf "LD_LIBRARY_PATH=%s\n" "$LD_LIBRARY_PATH"
            qemu-system-x86_64 --version
            ssh -V
            cargo fetch --locked
          '

      - name: Run VM benchmark
        run: |
          cleanup() {
            guix_cmd="$(command -v guix)"
            sudo "$guix_cmd" shell -m manifest-ci.scm -- \
              cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e stop --all \
              2>/dev/null || true
            sudo chown -R "$USER:$USER" target docs/benchmark-results.md 2>/dev/null || true
          }
          trap cleanup EXIT
          guix_cmd="$(command -v guix)"
          sudo "$guix_cmd" shell -m manifest-ci.scm -- sh -c '
            libgcc_dir="$(cd "$(dirname "$(gcc -print-libgcc-file-name)")/../../.." && pwd)"
            export LD_LIBRARY_PATH="$libgcc_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export GUIX_P2P_E2E_SUBSTITUTE_URLS="$3"
            export GUIX_P2P_E2E_ENABLE_KVM=auto
            export GUIX_P2P_E2E_VM_MEMORY=1536
            export GUIX_P2P_E2E_VM_CPUS=2

            cargo build --locked --release
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e image
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e run Bootstrap
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e run Alice
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e run Bob
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e wait-ssh Bootstrap Alice Bob
            cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e bootstrap Bootstrap
            exec cargo run --locked -p guix-p2p-e2e -- vm --state-dir target/guix-p2p-e2e benchmark \
              --suite "$1" \
              --modes http,p2p-only,p2p-first \
              --http-conditions normal \
              --seed-nodes Alice \
              --fetch-node Bob \
              --http-node Bob \
              --iterations "$2" \
              --output target/guix-p2p-bench
          ' sh "${{ inputs.suite }}" "${{ inputs.iterations }}" "$BENCHMARK_GUIX_SUBSTITUTE_URLS"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guix-p2p-benchmark-${{ inputs.suite }}-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            target/guix-p2p-bench/results.csv
            docs/benchmark-results.md

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp target/guix-p2p-bench/results.csv site/results.csv
          cp docs/benchmark-results.md site/benchmark-results.md
          cp docs/benchmarks.md site/benchmark-methodology.md
          cp docs/deployment.md site/deployment.md
          cp docs/configuration.md site/configuration.md
          cat > site/styles.css <<'CSS'
          :root {
            color-scheme: light dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            background: Canvas;
            color: CanvasText;
          }
          * {
            box-sizing: border-box;
          }
          body {
            margin: 0;
          }
          a {
            color: #0969da;
          }
          .site-header {
            border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent);
          }
          .site-header-inner, main {
            margin: 0 auto;
            max-width: 1120px;
            padding: 0 20px;
          }
          .site-header-inner {
            align-items: center;
            display: flex;
            gap: 24px;
            justify-content: space-between;
            min-height: 64px;
          }
          .brand {
            color: inherit;
            font-weight: 700;
            text-decoration: none;
          }
          nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
          }
          nav a {
            color: inherit;
            opacity: 0.78;
            text-decoration: none;
          }
          nav a[aria-current="page"] {
            opacity: 1;
            font-weight: 650;
          }
          main {
            padding-bottom: 48px;
            padding-top: 36px;
          }
          .hero {
            border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent);
            margin-bottom: 28px;
            padding-bottom: 28px;
          }
          h1, h2, h3 {
            line-height: 1.2;
          }
          h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            margin: 0 0 12px;
          }
          h2 {
            margin-top: 34px;
          }
          .lead {
            font-size: 1.08rem;
            max-width: 780px;
          }
          .muted {
            opacity: 0.72;
          }
          .actions, .doc-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
          }
          .button, .doc-link {
            border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
            border-radius: 8px;
            color: inherit;
            display: inline-flex;
            font-weight: 650;
            padding: 10px 14px;
            text-decoration: none;
          }
          .doc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          }
          .doc-link {
            align-items: flex-start;
            flex-direction: column;
            min-height: 104px;
          }
          .doc-link span {
            font-weight: 400;
            margin-top: 6px;
            opacity: 0.72;
          }
          .markdown {
            overflow-wrap: anywhere;
          }
          .table-wrap {
            margin: 16px 0 24px;
            overflow-x: auto;
          }
          table {
            border-collapse: collapse;
            min-width: 760px;
            width: 100%;
          }
          th, td {
            border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent);
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
          }
          th {
            background: color-mix(in srgb, currentColor 6%, transparent);
            font-weight: 700;
          }
          code {
            background: color-mix(in srgb, currentColor 8%, transparent);
            border-radius: 5px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.92em;
            padding: 0.12em 0.34em;
          }
          pre {
            background: color-mix(in srgb, currentColor 8%, transparent);
            overflow: auto;
            padding: 16px;
          }
          @media (max-width: 640px) {
            .site-header-inner {
              align-items: flex-start;
              flex-direction: column;
              gap: 8px;
              padding-bottom: 14px;
              padding-top: 14px;
            }
          }
          CSS

          cat > site/markdown.js <<'JS'
          function escapeHtml(value) {
            return value
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;");
          }

          function renderInline(value) {
            return escapeHtml(value).replace(/`([^`]+)`/g, "<code>$1</code>");
          }

          function splitTableRow(line) {
            return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
          }

          function isSeparatorRow(line) {
            return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
          }

          function renderMarkdown(markdown) {
            const lines = markdown.replace(/\r\n/g, "\n").split("\n");
            const html = [];
            let paragraph = [];
            let list = [];
            let inFence = false;
            let fence = [];

            function flushParagraph() {
              if (paragraph.length === 0) return;
              html.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
              paragraph = [];
            }

            function flushList() {
              if (list.length === 0) return;
              html.push(`<ul>${list.map((item) => `<li>${renderInline(item)}</li>`).join("")}</ul>`);
              list = [];
            }

            for (let i = 0; i < lines.length; i += 1) {
              const line = lines[i];

              if (line.startsWith("```")) {
                if (inFence) {
                  html.push(`<pre><code>${escapeHtml(fence.join("\n"))}</code></pre>`);
                  fence = [];
                  inFence = false;
                } else {
                  flushParagraph();
                  flushList();
                  inFence = true;
                }
                continue;
              }
              if (inFence) {
                fence.push(line);
                continue;
              }

              if (line.trim() === "") {
                flushParagraph();
                flushList();
                continue;
              }

              const tableNext = lines[i + 1] || "";
              if (line.includes("|") && isSeparatorRow(tableNext)) {
                flushParagraph();
                flushList();
                const headers = splitTableRow(line);
                i += 2;
                const rows = [];
                while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
                  rows.push(splitTableRow(lines[i]));
                  i += 1;
                }
                i -= 1;
                html.push(`<div class="table-wrap"><table><thead><tr>${headers.map((cell) => `<th>${renderInline(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
                continue;
              }

              const heading = /^(#{1,3})\s+(.+)$/.exec(line);
              if (heading) {
                flushParagraph();
                flushList();
                const level = heading[1].length;
                html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
                continue;
              }

              const item = /^-\s+(.+)$/.exec(line);
              if (item) {
                flushParagraph();
                list.push(item[1]);
                continue;
              }

              paragraph.push(line.trim());
            }

            flushParagraph();
            flushList();
            return html.join("\n");
          }
          JS

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>guix-p2p documentation</title>
            <link rel="stylesheet" href="styles.css">
          </head>
          <body>
            <header class="site-header">
              <div class="site-header-inner">
                <a class="brand" href="index.html">guix-p2p</a>
                <nav aria-label="Site navigation">
                  <a href="index.html" aria-current="page">Docs</a>
                  <a href="benchmarks.html">Benchmarks</a>
                  <a href="https://github.com/trevarj/guix-p2p/actions/workflows/benchmarks.yml">Runs</a>
                </nav>
              </div>
            </header>
            <main>
              <section class="hero">
                <h1>guix-p2p documentation</h1>
                <p class="lead muted">User-facing documentation and benchmark evidence for the GitHub mirror.</p>
                <p class="actions">
                  <a class="button" href="benchmarks.html">View latest benchmarks</a>
                  <a class="button" href="https://codeberg.org/trevarj/guix-p2p">Source on Codeberg</a>
                  <a class="button" href="https://github.com/trevarj/guix-p2p">GitHub mirror</a>
                </p>
              </section>
              <section>
                <h2>Documentation</h2>
                <div class="doc-grid">
                  <a class="doc-link" href="benchmarks.html">Benchmarks<span>Rendered latest report, CSV, and recent workflow runs.</span></a>
                  <a class="doc-link" href="benchmark-methodology.md">Benchmark methodology<span>How local and VM benchmark suites are run.</span></a>
                  <a class="doc-link" href="configuration.md">Configuration<span>Runtime options, paths, and substitute settings.</span></a>
                  <a class="doc-link" href="deployment.md">Deployment<span>Bootstrap node and deployment notes.</span></a>
                </div>
              </section>
            </main>
          </body>
          </html>
          HTML

          cat > site/benchmarks.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>guix-p2p benchmarks</title>
            <link rel="stylesheet" href="styles.css">
          </head>
          <body>
            <header class="site-header">
              <div class="site-header-inner">
                <a class="brand" href="index.html">guix-p2p</a>
                <nav aria-label="Site navigation">
                  <a href="index.html">Docs</a>
                  <a href="benchmarks.html" aria-current="page">Benchmarks</a>
                  <a href="https://github.com/trevarj/guix-p2p/actions/workflows/benchmarks.yml">Runs</a>
                </nav>
              </div>
            </header>
            <main>
              <section class="hero">
                <h1>Benchmarks</h1>
                <p class="lead muted">Latest generated report from the GitHub mirror benchmark workflow.</p>
                <p class="actions">
                  <a class="button" href="benchmark-results.md">Markdown report</a>
                  <a class="button" href="results.csv">CSV</a>
                  <a class="button" href="https://github.com/trevarj/guix-p2p/actions/workflows/benchmarks.yml">Workflow runs</a>
                </p>
              </section>

              <section>
                <h2>Latest Report</h2>
                <div id="report" class="markdown muted">Loading benchmark-results.md...</div>
              </section>

              <section>
                <h2>Recent Runs</h2>
                <p class="muted">Each run keeps its full CSV and markdown output as a GitHub Actions artifact.</p>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Run</th>
                        <th>Status</th>
                        <th>Started</th>
                        <th>Commit</th>
                      </tr>
                    </thead>
                    <tbody id="runs">
                      <tr><td colspan="4">Loading workflow runs...</td></tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </main>

            <script src="markdown.js"></script>
            <script>
              async function loadReport() {
                const report = document.getElementById("report");
                const response = await fetch("benchmark-results.md", { cache: "no-store" });
                if (!response.ok) {
                  report.textContent = "No benchmark report was published yet.";
                  return;
                }
                report.classList.remove("muted");
                report.innerHTML = renderMarkdown(await response.text());
              }

              async function loadRuns() {
                const runsBody = document.getElementById("runs");
                const response = await fetch(
                  "https://api.github.com/repos/trevarj/guix-p2p/actions/workflows/benchmarks.yml/runs?per_page=20",
                  { cache: "no-store" }
                );
                if (!response.ok) {
                  runsBody.innerHTML = "<tr><td colspan=\"4\">Could not load workflow runs.</td></tr>";
                  return;
                }
                const payload = await response.json();
                runsBody.innerHTML = payload.workflow_runs.map((run) => {
                  const started = new Date(run.created_at).toLocaleString();
                  const sha = run.head_sha.slice(0, 7);
                  return `<tr>
                    <td><a href="${run.html_url}">#${run.run_number}</a></td>
                    <td>${run.conclusion || run.status}</td>
                    <td>${started}</td>
                    <td><a href="${run.head_repository.html_url}/commit/${run.head_sha}">${sha}</a></td>
                  </tr>`;
                }).join("");
              }

              loadReport();
              loadRuns();
            </script>
          </body>
          </html>
          HTML

      - name: Configure Pages
        id: configure-pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        if: steps.configure-pages.outcome == 'success'
        with:
          path: site

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
        if: steps.configure-pages.outcome == 'success'
